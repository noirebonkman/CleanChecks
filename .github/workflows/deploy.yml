name: Check and deploy Cloudflare
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an update while its database migration is running.
concurrency:
  group: cleanchecks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install locked packages
        run: |
          npm ci
          npm run server:install
      - name: Account UI and deployment tests
        run: |
          node --max-old-space-size=384 tests/access-ui.mjs
          node tests/deployment-assets.mjs
          node tests/server-configuration.mjs
          node tests/github-backup.mjs
          node tests/github-ci-config.mjs
      - name: Server tests
        run: npm run server:test
      - name: Build and dry run
        run: |
          npm run server:build
          npm run server:check

  deploy:
    name: Backup, migrate and deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Check deployment settings
        run: node tools/ci-cloudflare.mjs check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Install locked packages and build
        run: |
          npm ci
          npm run server:install
          npm run server:build
          node tools/check-server-deployment.mjs
      - name: Export and encrypt database backup
        run: node tools/ci-cloudflare.mjs backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Retain encrypted backup
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cleanchecks-d1-${{ github.run_id }}-${{ github.run_attempt }}
          path: private/cloudflare-backup.encrypted
          if-no-files-found: error
          retention-days: 14
      - name: Apply additive database migrations
        run: node tools/ci-cloudflare.mjs migrate
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: node tools/ci-cloudflare.mjs deploy
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
