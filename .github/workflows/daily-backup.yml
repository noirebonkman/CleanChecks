name: Daily encrypted D1 backup
on:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanchecks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm --prefix server ci
      - name: Export and encrypt database backup
        run: node tools/ci-cloudflare.mjs backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cleanchecks-d1-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: private/cloudflare-backup.encrypted
          if-no-files-found: error
          retention-days: 7
